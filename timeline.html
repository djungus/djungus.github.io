<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Builder</title>
    <link rel="stylesheet" href="timeline.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="toolbar" class="toolbar glass">
        <button id="btn-add-node">Add Node</button>
        <button id="btn-add-fork">Add Fork</button>
        <button id="btn-save-json">Save JSON</button>
        <button id="btn-load-json">Load JSON</button>
        <button id="btn-export-html">Export HTML</button>
        <button id="btn-preview">Preview</button>
        <input type="file" id="file-input" style="display: none;" accept=".json">
    </div>

    <svg id="timeline-svg">
        <path id="timeline-path" d="" />
    </svg>

    <div id="timeline-container">
        <!-- Nodes will be injected here -->
    </div>

    <script src="timeline.js"></script>
</body>
</html>
